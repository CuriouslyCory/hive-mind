packages:
  - apps/*
  - packages/*

# Shared version pins. Workspaces reference these with "catalog:".
catalog:
  # Every @orpc/* package must use this same exact version: they depend on each
  # other at exact versions, so a range could install two copies.
  "@orpc/contract": 1.15.4
  "@orpc/openapi": 1.15.4
  "@orpc/server": 1.15.4
  "@orpc/zod": 1.15.4
  "@types/node": ^24.19.0
  "@types/pg": ^8.23.1
  drizzle-orm: ~0.45.3
  pg: ^8.23.0
  typescript: ~6.0.3
  vite: ^8.3.1
  vitest: ^5.0.2
  zod: ^4.6.5

# Every dependency with a build script must be reviewed here: true runs it,
# false skips it. strictDepBuilds (default true) fails the install on any
# package that is not listed. Never set dangerouslyAllowAllBuilds.
allowBuilds:
  # macOS-only optional dependency of vite. It ships a prebuilt fsevents.node
  # and no binding.gyp, so its "node-gyp rebuild" install script cannot succeed.
  fsevents: false
  # Pulled in by drizzle-kit (directly and via tsx and @esbuild-kit). The install
  # script only verifies the platform binary, which pnpm already installs from
  # the matching optional @esbuild/* package, so skipping it is safe.
  esbuild: false

overrides:
  # drizzle-orm has an optional peer on kysely, which better-auth brings into
  # apps/web. That gave apps/web a second copy of drizzle-orm, whose types
  # don't match the tables from @hivemind/db. Nothing here uses
  # drizzle-orm/kysely, so the peer is dropped to keep a single copy.
  "drizzle-orm>kysely": "-"
